<script type="text/babel">
const { useState, useCallback, useRef } = React;

// ═══════════════════════════════════════════════════════════
// SHARED CONSTANTS & COMPONENTS
// ═══════════════════════════════════════════════════════════

const LEVELS = ["open", "standard", "sensitive", "strict", "zero-trace"];
const LEVEL_COLORS = { "open":"#ef4444","standard":"#f97316","sensitive":"#eab308","strict":"#22c55e","zero-trace":"#06b6d4" };
const COMPLIANCE_OPTIONS = ["GDPR","HIPAA","CCPA","AI_ACT_EU","POPIA","PIPEDA"];
const PII_OPTIONS = ["email","phone","financial","health","identity","location","biometric"];
const JURISDICTIONS = ["DE","FR","US","GB","CH","JP","SG","AU"];
const RETENTION_OPTIONS = ["none","request","session","24h","7d","30d","unlimited"];
const RETENTION_ORDER = { "none":0,"request":1,"session":2,"24h":3,"7d":4,"30d":5,"unlimited":6 };
const DELEGATION_OPTIONS = ["none","same_or_higher","unrestricted"];
const DELEGATION_ORDER = { "none":0,"same_or_higher":1,"unrestricted":2 };
const ENVIRONMENT_OPTIONS = ["standard","containerized","TEE","enclave"];
const ENVIRONMENT_ORDER = { "standard":0,"containerized":1,"TEE":2,"enclave":3 };
const REPO = "https://github.com/StevenJohnson998/agent-data-handling-policy";

const TIPS = {
  c_level: "The minimum ADHP level the server must declare. Higher levels impose stricter data handling guarantees.",
  c_compliance: "Regulatory frameworks the server must declare compliance with. All selected frameworks are required.",
  c_proc_juris: "Countries where the server is allowed to process data. All server-declared processing jurisdictions must be within this list.",
  c_stor_juris: "Countries where the server is allowed to store data. All server-declared storage jurisdictions must be within this list.",
  c_pii: "PII categories the server must declare protection for. The server must cover all selected categories.",
  c_retention: "The maximum acceptable retention period. If the server retains data longer than this, the check fails.",
  c_delegation: "The maximum acceptable delegation policy. 'none' = server cannot delegate; 'same_or_higher' = delegation only to equal or stricter agents; 'unrestricted' = no limits.",
  c_environment: "The minimum execution environment required. Higher security environments: standard < containerized < TEE < enclave.",
  c_3rdparty: "If enabled, the server must declare that it does not share data with any third party.",
  c_training: "If enabled, the server must declare that it does not use data for model training.",
  c_no_logging: "If enabled, the server must declare that request/response content does not appear in logs.",
  c_sanitization: "If enabled, the server must declare that outputs are scrubbed of source data before returning.",
  c_no_marketing: "If enabled, the server must declare that it does not use data for direct marketing or commercial prospection (GDPR Art. 21).",
  c_allow_scientific: "If enabled, you consent to the server using data for scientific research purposes (GDPR Art. 89). If disabled and the server declares scientific usage, the check fails.",
  c_log_juris: "Countries where the server is allowed to keep logs. All server-declared log jurisdictions must be within this list.",
  s_level: "The ADHP level this server declares. Defines the overall data handling posture.",
  s_compliance: "Regulatory frameworks this server declares compliance with.",
  s_proc_juris: "Jurisdictions where this server may send data for processing. If left empty, the client/gateway will consider that the server offers no guarantee.",
  s_stor_juris: "Jurisdictions where this server may store data. If left empty, the client/gateway will consider that the server offers no guarantee.",
  s_log_juris: "Jurisdictions where this server may keep logs. If left empty, the client/gateway will consider that the server offers no guarantee.",
  s_pii: "PII categories this server declares protection for.",
  s_retention: "How long this server retains data after processing. 'none' = not retained; 'request' = deleted after each request; up to 'unlimited'.",
  s_delegation: "Whether this server may delegate tasks to other agents. 'none' = no delegation; 'same_or_higher' = only to agents at the same level or above.",
  s_environment: "The execution environment this server runs in. TEE and enclave provide hardware-level isolation.",
  s_3rdparty: "Whether this server commits to NOT sharing data with third parties. If not declared, assume data may be shared.",
  s_training: "Whether this server commits to NOT using data for model training. If not declared, assume data may be used for training.",
  s_logging: "Whether this server commits to NOT logging request/response content. If not declared, assume content may be logged.",
  s_sanitization: "Whether this server commits to scrubbing outputs of source data before returning results. If not declared, assume outputs are not sanitized.",
  s_marketing: "Whether this server commits to NOT using data for direct marketing or commercial prospection (GDPR Art. 21). If not declared, assume data may be used for prospection.",
  s_scientific: "Whether this server declares that data MAY be used for scientific research (GDPR Art. 89). Requires client consent to pass compliance checks.",
};

// ─── Copy button ───

function CopyButton({ getText }) {
  const [copied, setCopied] = useState(false);
  const handleCopy = () => {
    navigator.clipboard.writeText(getText()).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    });
  };
  return (
    <button onClick={handleCopy} title="Copy JSON" style={s({ background:"transparent", border:"1px solid #444", borderRadius:"3px", padding:"2px 6px", fontSize:"10px", color:copied?"#22c55e":"#777", cursor:"pointer", fontFamily:"'JetBrains Mono',monospace", transition:"color 0.2s" })}>
      {copied ? "Copied" : "Copy"}
    </button>
  );
}

// ─── Interactive JSON viewer with syntax highlighting & collapsible blocks ───

const JSON_COLORS = { key:"#7dd3fc", string:"#fbbf24", number:"#c4b5fd", bool:"#34d399", null:"#f87171", brace:"#555", comma:"#444" };
const HIGHLIGHT_COLOR = "#8b5cf6";
const INDENT_PX = 10;

function JsonView({ data, maxHeight="70vh", highlightKeys, title, titleColor }) {
  return (
    <div style={s({ display:"flex", flexDirection:"column", minHeight:0, flex:1 })}>
      <div style={s({ position:"sticky", top:0, zIndex:10, background:"#111", display:"flex", justifyContent:"space-between", alignItems:"center", paddingBottom:"6px", borderBottom:"1px solid #1a1a1a", marginBottom:"6px" })}>
        <span style={s({ fontSize:"10px", color:titleColor||"#666", letterSpacing:"1px", textTransform:"uppercase", fontWeight:700 })}>{title || ""}</span>
        <CopyButton getText={() => JSON.stringify(data, null, 2)} />
      </div>
      <div style={s({ fontSize:"10.5px", fontFamily:"'JetBrains Mono',monospace", lineHeight:"1.7", maxHeight, overflowY:"auto", overflowX:"hidden", flex:1 })}>
        <JsonNode value={data} depth={0} isLast={true} defaultOpen={true} keyName="" highlightKeys={highlightKeys || new Set()} path="" />
      </div>
    </div>
  );
}

function JsonNode({ value, depth, isLast, defaultOpen, keyName, highlightKeys, path }) {
  const indent = depth * INDENT_PX;
  const currentPath = path ? (path + "." + keyName) : keyName;
  const isHighlighted = highlightKeys.has(keyName) || highlightKeys.has(currentPath);

  if (value === null) return <span><span style={{color:JSON_COLORS.null}}>null</span>{!isLast && <span style={{color:JSON_COLORS.comma}}>,</span>}</span>;
  if (typeof value === "boolean") return <span><span style={{color:JSON_COLORS.bool}}>{value?"true":"false"}</span>{!isLast && <span style={{color:JSON_COLORS.comma}}>,</span>}</span>;
  if (typeof value === "number") return <span><span style={{color:JSON_COLORS.number}}>{value}</span>{!isLast && <span style={{color:JSON_COLORS.comma}}>,</span>}</span>;
  if (typeof value === "string") return <span><span style={{color:JSON_COLORS.string}}>"{value}"</span>{!isLast && <span style={{color:JSON_COLORS.comma}}>,</span>}</span>;

  const isArray = Array.isArray(value);
  const entries = isArray ? value.map((v,i) => [i, v]) : Object.entries(value);
  const openBrace = isArray ? "[" : "{";
  const closeBrace = isArray ? "]" : "}";
  const forceOpen = isHighlighted || defaultOpen || depth < 2;
  const hasHighlightedDescendant = highlightKeys.size > 0 && (function check(v) {
    if (typeof v !== "object" || v === null) return false;
    if (!Array.isArray(v) && Object.keys(v).some(k => highlightKeys.has(k))) return true;
    const children = Array.isArray(v) ? v : Object.values(v);
    return children.some(child => check(child));
  })(value);
  const autoOpen = forceOpen || hasHighlightedDescendant;
  const [open, setOpen] = useState(autoOpen);

  if (entries.length === 0) {
    return <span><span style={{color:JSON_COLORS.brace}}>{openBrace}{closeBrace}</span>{!isLast && <span style={{color:JSON_COLORS.comma}}>,</span>}</span>;
  }

  // Inline short arrays of primitives
  if (isArray && entries.length <= 4 && entries.every(([,v]) => typeof v === "string" || typeof v === "number")) {
    const inner = entries.map(([,v],i) => {
      const last = i === entries.length - 1;
      const c = typeof v === "string" ? JSON_COLORS.string : JSON_COLORS.number;
      const display = typeof v === "string" ? `"${v}"` : String(v);
      return <span key={i}><span style={{color:c}}>{display}</span>{!last && <span style={{color:JSON_COLORS.comma}}>, </span>}</span>;
    });
    return <span><span style={{color:JSON_COLORS.brace}}>[</span>{inner}<span style={{color:JSON_COLORS.brace}}>]</span>{!isLast && <span style={{color:JSON_COLORS.comma}}>,</span>}</span>;
  }

  const preview = isArray ? `${entries.length} items` : Object.keys(value).slice(0,3).join(", ") + (Object.keys(value).length > 3 ? ", ..." : "");

  if (!open) {
    return (
      <span>
        <span onClick={() => setOpen(true)} style={{cursor:"pointer", color:JSON_COLORS.brace, userSelect:"none"}}>
          <span style={{color:"#666", fontSize:"9px", marginRight:"4px"}}>▶</span>
          {openBrace} <span style={{color:"#555", fontStyle:"italic", fontSize:"10px"}}>{preview}</span> {closeBrace}
        </span>
        {!isLast && <span style={{color:JSON_COLORS.comma}}>,</span>}
      </span>
    );
  }

  const wrapStyle = isHighlighted ? {
    background: HIGHLIGHT_COLOR + "1a",
    borderLeft: `2px solid ${HIGHLIGHT_COLOR}`,
    borderRadius: "4px",
    marginLeft: "-4px",
    paddingLeft: "2px",
    paddingTop: "2px",
    paddingBottom: "2px",
  } : {};

  return (
    <span>
      <span onClick={() => setOpen(false)} style={{cursor:"pointer", color: isHighlighted ? HIGHLIGHT_COLOR : JSON_COLORS.brace, userSelect:"none"}}>
        <span style={{color: isHighlighted ? HIGHLIGHT_COLOR : "#666", fontSize:"9px", marginRight:"4px"}}>▼</span>
        {isHighlighted && <span style={{color:HIGHLIGHT_COLOR, fontSize:"10px", fontWeight:700, marginRight:"6px", letterSpacing:"0.5px"}}>ADHP</span>}
        {openBrace}
      </span>
      <div style={wrapStyle}>
      {entries.map(([key, val], i) => {
        const last = i === entries.length - 1;
        const childIsHighlighted = highlightKeys.has(String(key));
        const childIndent = isHighlighted ? INDENT_PX : indent + INDENT_PX;
        return (
          <div key={key} style={{paddingLeft: childIndent + "px"}}>
            {!isArray && <><span style={{color: childIsHighlighted ? HIGHLIGHT_COLOR : JSON_COLORS.key, fontWeight: childIsHighlighted ? 700 : 400}}>"{key}"</span><span style={{color:"#555"}}>: </span></>}
            <JsonNode value={val} depth={isHighlighted ? 1 : depth+1} isLast={last} defaultOpen={false} keyName={String(key)} highlightKeys={highlightKeys} path={currentPath} />
          </div>
        );
      })}
      </div>
      <span style={{paddingLeft: indent + "px", color: isHighlighted ? HIGHLIGHT_COLOR : JSON_COLORS.brace}}>{closeBrace}</span>
      {!isLast && <span style={{color:JSON_COLORS.comma}}>,</span>}
    </span>
  );
}

const ExpandButton = ({ expanded, onClick }) => (
  <button onClick={onClick} style={s({ width:"100%", padding:"8px", marginTop:"12px", background:"transparent", border:"1px solid #222", borderRadius:"4px", color:"#666", fontSize:"12px", fontFamily:"'JetBrains Mono',monospace", cursor:"pointer", transition:"all 0.2s", display:"flex", alignItems:"center", justifyContent:"center", gap:"6px" })}>

// Shared ADHP compliance check logic
function runADHPChecks(opts) {
  const { clientMinLevel, clientCompliance, clientNoThirdParty, clientNoTraining, clientJurisdiction, clientStorageJurisdiction, clientLogJurisdiction, clientMaxRetention, clientMaxDelegation, clientMinEnvironment, clientRequiredPii, clientNoContentLogging, clientRequireSanitization, clientNoDirectMarketing, clientAllowScientific, serverLevel, serverCompliance, serverTrainingOptOut, serverRetention, serverDelegation, serverPii, serverThirdPartyOptOut, serverJurisdiction, serverStorageJurisdiction, serverLogJurisdiction, serverEnvironment, serverContentLoggingOptOut, serverSanitizationOptIn, serverDirectMarketingOptOut, serverScientificUsageOptIn } = opts;
  const failures = [];
  const checks = [];
  const sIdx = LEVELS.indexOf(serverLevel);
  const cIdx = LEVELS.indexOf(clientMinLevel);

  if (sIdx >= cIdx) {
    checks.push({ pass:true, msg:`Level: server "${serverLevel}" (${sIdx}) >= required "${clientMinLevel}" (${cIdx})` });
  } else {
    failures.push(true);
    checks.push({ pass:false, msg:`Level: server "${serverLevel}" (${sIdx}) < required "${clientMinLevel}" (${cIdx})` });
  }
  if (clientNoTraining) {
    if (serverTrainingOptOut) {
      checks.push({ pass:true, msg:"Training opt-out: declared by server" });
    } else {
      failures.push(true);
      checks.push({ pass:false, msg:"Training opt-out: not declared (required)" });
    }
  }
  const missingCompliance = clientCompliance.filter(c => !serverCompliance.includes(c));
  if (clientCompliance.length > 0) {
    if (missingCompliance.length === 0) {
      checks.push({ pass:true, msg:`Compliance: ${clientCompliance.join(", ")} — all declared` });
    } else {
      failures.push(true);
      checks.push({ pass:false, msg:`Compliance: missing ${missingCompliance.join(", ")}` });
    }
  }
  if (clientNoThirdParty) {
    if (serverThirdPartyOptOut) {
      checks.push({ pass:true, msg:"Third-party sharing: server opts out" });
    } else {
      failures.push(true);
      checks.push({ pass:false, msg:"Third-party sharing: server does not opt out (required)" });
    }
  }
  if (RETENTION_ORDER[serverRetention] > RETENTION_ORDER[clientMaxRetention]) {
    failures.push(true);
    checks.push({ pass:false, msg:`Retention: server "${serverRetention}" exceeds max "${clientMaxRetention}"` });
  } else {
    checks.push({ pass:true, msg:`Retention: server "${serverRetention}" <= max "${clientMaxRetention}"` });
  }
  if (DELEGATION_ORDER[serverDelegation] > DELEGATION_ORDER[clientMaxDelegation]) {
    failures.push(true);
    checks.push({ pass:false, msg:`Delegation: server "${serverDelegation}" exceeds max "${clientMaxDelegation}"` });
  } else {
    checks.push({ pass:true, msg:`Delegation: server "${serverDelegation}" <= max "${clientMaxDelegation}"` });
  }
  if (ENVIRONMENT_ORDER[serverEnvironment] < ENVIRONMENT_ORDER[clientMinEnvironment]) {
    failures.push(true);
    checks.push({ pass:false, msg:`Environment: server "${serverEnvironment}" below required "${clientMinEnvironment}"` });
  } else {
    checks.push({ pass:true, msg:`Environment: server "${serverEnvironment}" >= min "${clientMinEnvironment}"` });
  }
  if (clientRequiredPii.length > 0) {
    const missingPii = clientRequiredPii.filter(p => !serverPii.includes(p));
    if (missingPii.length === 0) {
      checks.push({ pass:true, msg:`PII protection: ${clientRequiredPii.join(", ")} — all covered` });
    } else {
      failures.push(true);
      checks.push({ pass:false, msg:`PII protection: missing ${missingPii.join(", ")}` });
    }
  }
  const checkJurisdiction = (label, clientJ, serverJ) => {
    if (clientJ.length > 0) {
      if (serverJ.length === 0) {
        failures.push(true);
        checks.push({ pass:false, msg:`${label}: server undeclared (assume worst case)` });
      } else {
        const unaccepted = serverJ.filter(j => !clientJ.includes(j));
        if (unaccepted.length === 0) {
          checks.push({ pass:true, msg:`${label}: server [${serverJ.join(", ")}] all within accepted [${clientJ.join(", ")}]` });
        } else {
          failures.push(true);
          checks.push({ pass:false, msg:`${label}: server may use [${unaccepted.join(", ")}] outside accepted [${clientJ.join(", ")}]` });
        }
      }
    }
  };
  checkJurisdiction("Processing jurisdiction", clientJurisdiction, serverJurisdiction);
  checkJurisdiction("Storage jurisdiction", clientStorageJurisdiction, serverStorageJurisdiction);
  checkJurisdiction("Log jurisdiction", clientLogJurisdiction, serverLogJurisdiction);
  if (clientNoContentLogging) {
    if (serverContentLoggingOptOut) {
      checks.push({ pass:true, msg:"Content logging: server opts out" });
    } else {
      failures.push(true);
      checks.push({ pass:false, msg:"Content logging: server does not opt out (required)" });
    }
  }
  if (clientRequireSanitization) {
    if (serverSanitizationOptIn) {
      checks.push({ pass:true, msg:"Output sanitization: server opts in" });
    } else {
      failures.push(true);
      checks.push({ pass:false, msg:"Output sanitization: server does not opt in (required)" });
    }
  }
  if (clientNoDirectMarketing) {
    if (serverDirectMarketingOptOut) {
      checks.push({ pass:true, msg:"Direct marketing: server opts out" });
    } else {
      failures.push(true);
      checks.push({ pass:false, msg:"Direct marketing: server does not opt out (required)" });
    }
  }
  if (!clientAllowScientific && serverScientificUsageOptIn) {
    failures.push(true);
    checks.push({ pass:false, msg:"Scientific usage: server declares research use but client has not consented" });
  } else if (clientAllowScientific) {
    checks.push({ pass:true, msg:"Scientific usage: client consents to research use" });
  } else if (!serverScientificUsageOptIn) {
    checks.push({ pass:true, msg:"Scientific usage: server does not declare research use" });
  }
  return { pass: failures.length === 0, checks };
}

// Shared client/server panels
function ClientPanel({ state, setState, expanded, setExpanded, accentColor="#3b82f6", label="Client / Gateway", description }) {

    <div style={s({ background:"#111", border:`1px solid ${accentColor}33`, borderRadius:"8px", padding:"14px" })}>
      <div style={s({ display:"flex", alignItems:"center", gap:"8px", marginBottom:"4px" })}>
        <div style={s({ width:"8px", height:"8px", borderRadius:"50%", background:accentColor })} />

function ResultPanel({ result, hasExecuted, protocolLabel, passMessage, failMessage }) {

                {c.pass?"✓":"✗"} {c.msg}

            {result.pass

}

const ADHP_EXTENSION_URI = "https://github.com/StevenJohnson998/agent-data-handling-policy/blob/main/SPEC.md";

function A2ADemo() {
  const [client, setClient] = useState(defaultClientState());
  const [server, setServer] = useState(defaultServerState());
  const [clientExpanded, setClientExpanded] = useState(false);
  const [serverExpanded, setServerExpanded] = useState(false);
  const [result, setResult] = useState(null);
  const [hasExecuted, setHasExecuted] = useState(false);

  const buildAgentCard = () => ({
    name: "Healthcare Concierge",
    description: "Multi-provider healthcare agent",
    version: "1.2.0",
    supportedInterfaces: [
      { url: "https://api.medtech.example.com/a2a", protocolBinding: "JSONRPC", protocolVersion: "1.0" }
    ],
    capabilities: {
      streaming: true,
      pushNotifications: true,
      extensions: [
        {
          uri: ADHP_EXTENSION_URI,
          description: "Data handling practices (ADHP v0.2)",
          required: false,
          params: {
            level: server.serverLevel,
            training_opt_out: server.serverTrainingOptOut,
            max_retention: server.serverRetention,
            content_logging_opt_out: server.serverContentLoggingOptOut,
            delegation_policy: server.serverDelegation,
            output_sanitization_opt_in: server.serverSanitizationOptIn,
            compliance: server.serverCompliance,
            pii_categories: server.serverPii,
            processing_jurisdiction: server.serverJurisdiction,
            storage_jurisdiction: server.serverStorageJurisdiction,
            log_jurisdiction: server.serverLogJurisdiction,
            execution_environment: server.serverEnvironment,
            third_party_opt_out: server.serverThirdPartyOptOut,
            direct_marketing_opt_out: server.serverDirectMarketingOptOut,
            scientific_usage_opt_in: server.serverScientificUsageOptIn
          }
        }
      ]
    },
    defaultInputModes: ["text/plain"],
    defaultOutputModes: ["text/plain", "application/json"],
    skills: [
      { id: "provider-lookup", name: "Healthcare Provider Lookup", description: "Find providers by specialty and insurance", tags: ["healthcare", "insurance"] }
    ]
  });

  const buildClientRequest = () => ({
    method: "GET",
    url: "https://api.medtech.example.com/.well-known/agent-card.json",
    headers: {
      "A2A-Version": "1.0",
      "A2A-Extensions": ADHP_EXTENSION_URI,
      "Accept": "application/json"
    }
  });

  const executeCheck = useCallback(() => {
    setResult(runADHPChecks({ ...client, ...server }));
    setHasExecuted(true);
  }, [client, server]);

  return (
    <div>
      {/* Info box */}
      <div style={s({ marginBottom:"12px", padding:"8px 12px", background:"#111", border:"1px solid #1e1e1e", borderLeft:"3px solid #8b5cf6", borderRadius:"6px", fontSize:"11px", color:"#777", lineHeight:"1.6" })}>
        <strong style={s({ color:"#999" })}>How it works:</strong>{" "}
        A2A agents publish an <a href="https://a2a-protocol.org/latest/topics/agent-discovery/" target="_blank" rel="noopener noreferrer" style={s({ color:"#3b82f6", textDecoration:"none" })}>Agent Card</a> at
        {" "}<code style={s({ color:"#f97316", background:"#1a1200", padding:"1px 4px", borderRadius:"2px", fontSize:"10px" })}>/.well-known/agent-card.json</code>.
        {" "}ADHP adds a <a href="https://a2a-protocol.org/latest/topics/extensions/" target="_blank" rel="noopener noreferrer" style={s({ color:"#3b82f6", textDecoration:"none" })}>data-only extension</a> to
        {" "}<code style={s({ color:"#f97316", background:"#1a1200", padding:"1px 4px", borderRadius:"2px", fontSize:"10px" })}>capabilities.extensions[]</code>
        {" "}— a privacy label for AI agents. The client requests the extension via the{" "}
        <code style={s({ color:"#f97316", background:"#1a1200", padding:"1px 4px", borderRadius:"2px", fontSize:"10px" })}>A2A-Extensions</code> header
        {" "}and checks declarations <em>before sending any task</em>.
        No declaration = assume <LevelBadge level="open" /> (worst case).
      </div>

      {/* Main Grid */}
      <div className="pg-grid" style={s({ display:"grid", gridTemplateColumns:"220px 1fr 220px", gap:"12px" })}>
        {/* LEFT — Client */}
        <ClientPanel
          state={client} setState={setClient}
          expanded={clientExpanded} setExpanded={setClientExpanded}
          accentColor="#3b82f6"
          label="A2A Client"
          description="The orchestrating agent. Discovers agents via Agent Cards and checks ADHP extensions before delegating tasks."
        />

        {/* CENTER */}
        <div style={s({ display:"flex", flexDirection:"column", gap:"12px", minWidth:0 })}>
          <div className="pg-center-grid" style={s({ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"12px" })}>
            {/* Client request */}
            <div style={s({ background:"#111", border:"1px solid #1e3a5f", borderRadius:"8px", padding:"12px", display:"flex", flexDirection:"column", minWidth:0 })}>
              <JsonView data={buildClientRequest()} title="① Discovery Request" titleColor="#3b82f6" />
            </div>
            {/* Agent Card response */}
            <div style={s({ background:"#111", border:"1px solid #2d1e0f", borderRadius:"8px", padding:"12px", display:"flex", flexDirection:"column", minWidth:0 })}>
              <JsonView data={buildAgentCard()} highlightKeys={new Set(["params"])} title="② Agent Card + ADHP Extension" titleColor="#f97316" />
            </div>
          </div>

          <button onClick={executeCheck} style={s({ padding:"12px 24px", background:"linear-gradient(135deg,#3b82f6,#8b5cf6)", color:"#fff", border:"none", borderRadius:"6px", fontSize:"14px", fontWeight:700, fontFamily:"'Space Grotesk',sans-serif", cursor:"pointer", letterSpacing:"0.5px", boxShadow:"0 0 24px rgba(59,130,246,0.25)" })}>
                ③ Check ADHP Compliance
          </button>

          <ResultPanel
            result={result}
            hasExecuted={hasExecuted}
            protocolLabel="A2A"
            passMessage="Agent meets all requirements — task delegation proceeds"
            failMessage="Agent does not meet requirements — client skips this agent"
          />
        </div>

        {/* RIGHT — Agent */}
        <ServerPanel
          state={server} setState={setServer}
          expanded={serverExpanded} setExpanded={setServerExpanded}
          accentColor="#f97316"
          label="A2A Agent"
          description="The agent. Declares data handling practices via ADHP extension in its Agent Card."
        />
      </div>
    </div>
  );
}

function MCPDemo() {
  const [client, setClient] = useState(defaultClientState());
  const [server, setServer] = useState(defaultServerState());
  const [clientExpanded, setClientExpanded] = useState(false);
  const [serverExpanded, setServerExpanded] = useState(false);
  const [result, setResult] = useState(null);
  const [hasExecuted, setHasExecuted] = useState(false);

  const buildClientRequest = () => ({
    jsonrpc: "2.0", id: 1, method: "initialize",
    params: {
      protocolVersion: "2025-03-26",
      capabilities: { roots: { listChanged: true } },
      clientInfo: { name: "ADHP Demo Client", version: "0.1.0" }
    }
  });

  const buildServerResponse = () => ({
    jsonrpc: "2.0", id: 1,
    result: {
      protocolVersion: "2025-03-26",
      capabilities: {
        tools: { listChanged: true }, resources: {},
        adhp: {
          level: server.serverLevel,
          training_opt_out: server.serverTrainingOptOut,
          max_retention: server.serverRetention,
          delegation_policy: server.serverDelegation,
          compliance: server.serverCompliance,
          pii_categories: server.serverPii,
          processing_jurisdiction: server.serverJurisdiction,
          storage_jurisdiction: server.serverStorageJurisdiction,
          log_jurisdiction: server.serverLogJurisdiction,
          execution_environment: server.serverEnvironment,
          content_logging_opt_out: server.serverContentLoggingOptOut,
          output_sanitization_opt_in: server.serverSanitizationOptIn,
          third_party_opt_out: server.serverThirdPartyOptOut,
          direct_marketing_opt_out: server.serverDirectMarketingOptOut,
          scientific_usage_opt_in: server.serverScientificUsageOptIn
        }
      },
      serverInfo: { name: "Demo Agent", version: "1.0.0" }
    }
  });

  const executeCheck = useCallback(() => {
    setResult(runADHPChecks({ ...client, ...server }));
    setHasExecuted(true);
  }, [client, server]);

  return (
    <div>
      {/* Info box */}
      <div style={s({ marginBottom:"12px", padding:"8px 12px", background:"#111", border:"1px solid #1e1e1e", borderLeft:"3px solid #8b5cf6", borderRadius:"6px", fontSize:"11px", color:"#777", lineHeight:"1.6" })}>
        <strong style={s({ color:"#999" })}>How it works:</strong>{" "}
        During the <a href="https://spec.modelcontextprotocol.io/specification/2025-03-26/basic/lifecycle/" target="_blank" rel="noopener noreferrer" style={s({ color:"#3b82f6", textDecoration:"none" })}>MCP initialize handshake</a>,
        the server returns an <code style={s({ color:"#f97316", background:"#1a1200", padding:"1px 4px", borderRadius:"2px", fontSize:"10px" })}>adhp</code> object inside <code style={s({ color:"#f97316", background:"#1a1200", padding:"1px 4px", borderRadius:"2px", fontSize:"10px" })}>capabilities</code>
        {" "}— a privacy label for AI agents. The client checks these declarations <em>before sending any data</em>.
        No declaration = assume <LevelBadge level="open" /> (worst case).
        This demo shows a selection of the most important ADHP fields — see our <a href={REPO+"/blob/main/SPEC.md"} target="_blank" rel="noopener noreferrer" style={s({ color:"#3b82f6", textDecoration:"none" })}>full specification on GitHub</a> for the complete property reference.
      </div>

      {/* Main Grid */}
      <div className="pg-grid" style={s({ display:"grid", gridTemplateColumns:"220px 1fr 220px", gap:"12px" })}>
        {/* LEFT — Client */}
        <ClientPanel
          state={client} setState={setClient}
          expanded={clientExpanded} setExpanded={setClientExpanded}
          accentColor="#3b82f6"
          label="MCP Client / Gateway"
          description="The data sender. Sets minimum standards a server must meet before any data is transmitted."
        />

        {/* CENTER */}
        <div style={s({ display:"flex", flexDirection:"column", gap:"12px", minWidth:0 })}>
          <div className="pg-center-grid" style={s({ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"12px" })}>
            <div style={s({ background:"#111", border:"1px solid #1e3a5f", borderRadius:"8px", padding:"12px", display:"flex", flexDirection:"column", minWidth:0 })}>
              <JsonView data={buildClientRequest()} title="① Client → Request" titleColor="#3b82f6" />
            </div>
            <div style={s({ background:"#111", border:"1px solid #2d1e0f", borderRadius:"8px", padding:"12px", display:"flex", flexDirection:"column", minWidth:0 })}>
              <JsonView data={buildServerResponse()} highlightKeys={new Set(["adhp"])} title="② Server → Response + ADHP" titleColor="#f97316" />
            </div>
          </div>

          <button onClick={executeCheck} style={s({ padding:"12px 24px", background:"linear-gradient(135deg,#3b82f6,#8b5cf6)", color:"#fff", border:"none", borderRadius:"6px", fontSize:"14px", fontWeight:700, fontFamily:"'Space Grotesk',sans-serif", cursor:"pointer", letterSpacing:"0.5px", boxShadow:"0 0 24px rgba(59,130,246,0.25)" })}>
                ③ Check ADHP Compliance
          </button>

          <ResultPanel
            result={result}
            hasExecuted={hasExecuted}
            protocolLabel="MCP"
            passMessage="Server meets all requirements — connection proceeds"
            failMessage="Server does not meet requirements — client disconnects"
          />
        </div>

        {/* RIGHT — Server */}
        <ServerPanel
          state={server} setState={setServer}
          expanded={serverExpanded} setExpanded={setServerExpanded}
          accentColor="#f97316"
          label="MCP Server"
          description="The agent. Declares its data handling practices via ADHP in the initialize response."
        />
      </div>
    </div>
  );
}
